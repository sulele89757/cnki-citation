[package]
name = "cnki_citation_rs"
version = "1.0.4"
edition = "2021"
description = "CNKI 论文引文获取工具 (GB/T 7714-2025) — Rust 抓取引擎核心库"

[lib]
name = "cnki_citation_rs"
path = "src/lib.rs"

[dependencies]
# ── 纯逻辑依赖 ──
regex = "1"
rand = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1"

# ── 时间戳（导出文件名 / 日志）──
chrono = "0.4"

# ── 网络 / 更新检测 ──
ureq = { version = "2", features = ["json"] }

# ── Excel 读写（对标 openpyxl）──
umya-spreadsheet = "0.9"

# ── 浏览器驱动（探针已确认 headless_chrome 1.x 可编译）──
headless_chrome = { version = "1", optional = true }

[features]
default = []
browser = ["dep:headless_chrome"]
