name: Build and Release

# 触发：推送 tag（形如 v1.0.1）即自动构建并发布
# 构建：GitHub 云端 windows-latest（无需本机常驻）
# 仅构建 Rust/Tauri 实现（Python 版仅作为参考代码保留，不再参与构建）
# 发布产物：
#   GitHub Release：CNKI-rs-installer.exe — Tauri NSIS，安装时联网下载 WebView2（轻量）
#   Gitee Release（国内镜像）：CNKI-rs-installer.exe 直传（<100MB，无需分卷）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    env:
      GITEE_OWNER: sulele
      GITEE_REPO: cnki-citation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 共享版本号（从 tag 剥离前缀 v）─────────────────
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ═════════════════════════════════════════════════════
      # Rust / Tauri 构建（CNKI-rs-installer.exe）
      # ═════════════════════════════════════════════════════
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry, index & binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('rust/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bin-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0"

      - name: Bump version in Rust source
        working-directory: rust/src-tauri
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 更新 tauri.conf.json version
          python -c "import json; p='tauri.conf.json'; c=json.load(open(p,encoding='utf-8')); c['version']='${VER}'; json.dump(c,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False); print('tauri.conf.json version -> ${VER}')"
          # 更新 Cargo.toml version（两处：src-tauri 应用 + 根库）
          sed -i "s/^version = .*/version = \"${VER}\"/" Cargo.toml
          sed -i "s/^version = .*/version = \"${VER}\"/" ../Cargo.toml
          echo "Rust version -> $VER"

      - name: Build Tauri installer (embedBootstrapper, 联网下载 WebView2)
        working-directory: rust/src-tauri
        run: |
          cargo tauri build
          mkdir -p ../../dist
          cp target/release/bundle/nsis/*.exe ../../dist/CNKI-rs-installer.exe
          echo "installer -> $(du -h ../../dist/CNKI-rs-installer.exe | cut -f1)"

      # ═════════════════════════════════════════════════════
      # 发布
      # ═════════════════════════════════════════════════════
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/CNKI-rs-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Gitee Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          EXE_PATH_RS: dist/CNKI-rs-installer.exe
          NOTES: ${{ github.event.head_commit.message }}
          BRANCH: main
        run: python .github/workflows/sync_gitee.py
