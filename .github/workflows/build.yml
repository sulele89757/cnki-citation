name: Build and Release

# 触发：推送 tag（形如 v1.0.1）即自动构建并发布
# 构建：GitHub 云端 windows-latest（无需本机常驻）
# 发布产物：
#   ① CNKICitationTool.exe      — Python/PyInstaller 版（60MB+，含 Python 运行时 + 浏览器）
#   ② CNKICitationTool-rs.exe  — Rust/Tauri 原生版（22MB，单文件 WebView2 桌面应用）
# 同步到 Gitee Release（国内用户从 Gitee 下载，稳、快）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    env:
      GITEE_OWNER: sulele
      GITEE_REPO: cnki-citation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 共享版本号（从 tag 剥离前缀 v）─────────────────
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ═════════════════════════════════════════════════════
      # ① Python / PyInstaller 构建（CNKICitationTool.exe）
      # ═════════════════════════════════════════════════════
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bump APP_VERSION in Python source
        run: |
          python -c "import re;p='cnki_citation.py';s=open(p,encoding='utf-8').read();s=re.sub(r'(?m)^APP_VERSION = \".*\"', 'APP_VERSION = \"${{ steps.ver.outputs.version }}\"', s, count=1);open(p,'w',encoding='utf-8').write(s)"
          echo "Python APP_VERSION -> ${{ steps.ver.outputs.version }}"

      - name: Build Python exe (PyInstaller)
        run: |
          rm -f "CNKICitationTool.spec"
          python -m PyInstaller --name "CNKICitationTool" --onefile --windowed --icon assets/app.ico \
            --hidden-import customtkinter --hidden-import playwright_stealth \
            --hidden-import openpyxl --hidden-import pystray \
            --collect-all playwright --collect-all playwright_stealth --collect-all pystray \
            --hidden-import certifi \
            --add-data "assets/批量引文模板.xlsx;assets" \
            --add-data "assets/cnki_icon.png;assets" \
            --add-data "assets/cnki_icon_dark.png;assets" \
            --add-data "assets/cnki_icon.ico;assets" \
            --add-data "assets/cnki_icon_dark.ico;assets" \
            cnki_gui.py

      # ═════════════════════════════════════════════════════
      # ② Rust / Tauri 构建（CNKICitationTool-rs.exe）
      # ═════════════════════════════════════════════════════
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cnki_rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cnki_rust/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Bump version in Rust source
        working-directory: cnki_rust/src-tauri
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 更新 tauri.conf.json version
          python -c "import json; p='tauri.conf.json'; c=json.load(open(p,encoding='utf-8')); c['version']='${VER}'; json.dump(c,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False); print('tauri.conf.json version -> ${VER}')"
          # 更新 Cargo.toml version（如需要）
          sed -i "s/^version = .*/version = \"${VER}\"/" Cargo.toml 2>/dev/null || true
          echo "Rust version -> $VER"

      - name: Build Rust exe (Tauri)
        working-directory: cnki_rust/src-tauri
        run: cargo build --release

      - name: Rename Rust exe to CNKICitationTool-rs
        run: |
          SRC="cnki_rust/src-tauri/target/release/cnki-citation-rs.exe"
          DST="dist/CNKICitationTool-rs.exe"
          if [ -f "$SRC" ]; then
            cp -f "$SRC" "$DST"
            echo "Rust exe -> $DST ($(du -h "$DST" | cut -f1))"
          else
            echo "ERROR: Rust exe not found at $SRC"
            ls cnki_rust/src-tauri/target/release/*.exe 2>/dev/null || echo "No exe in target/release/"
            exit 1
          fi

      # ═════════════════════════════════════════════════════
      # ③ 发布
      # ═════════════════════════════════════════════════════
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/CNKICitationTool.exe
            dist/CNKICitationTool-rs.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Gitee Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          EXE_PATH_PYTHON: dist/CNKICitationTool.exe
          EXE_PATH_RUST: dist/CNKICitationTool-rs.exe
          NOTES: ${{ github.event.head_commit.message }}
          BRANCH: main
        run: python .github/workflows/sync_gitee.py
