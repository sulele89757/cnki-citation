name: Build and Release

# 触发：推送 tag（形如 v1.0.1）即自动构建并发布
# 构建：GitHub 云端 windows-latest（无需本机常驻）
# 发布产物：
#   GitHub Release（三个全上）：
#     ① CNKICitationTool.exe                       — Python/PyInstaller 版
#     ② CNKICitationTool-rs-offline-installer.exe  — Tauri NSIS，内置 WebView2 离线可装（~150MB）
#     ③ CNKICitationTool-rs-lite-installer.exe     — Tauri NSIS，安装时联网下载 WebView2（轻量）
#   Gitee Release（附件单文件 ≤100MB）：Python + lite 直传；offline 超限 →
#     sync_gitee.py 自动切成 ≤95MB 分卷 + Rust 自合并引导器（offline_join.exe，
#     用户双击即自动拼回并启动安装器），国内用户从 Gitee 下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    env:
      GITEE_OWNER: sulele
      GITEE_REPO: cnki-citation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 共享版本号（从 tag 剥离前缀 v）─────────────────
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ═════════════════════════════════════════════════════
      # ① Python / PyInstaller 构建（CNKICitationTool.exe）
      # ═════════════════════════════════════════════════════
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bump APP_VERSION in Python source
        run: |
          python -c "import re;p='cnki_citation.py';s=open(p,encoding='utf-8').read();s=re.sub(r'(?m)^APP_VERSION = \".*\"', 'APP_VERSION = \"${{ steps.ver.outputs.version }}\"', s, count=1);open(p,'w',encoding='utf-8').write(s)"
          echo "Python APP_VERSION -> ${{ steps.ver.outputs.version }}"

      - name: Build Python exe (PyInstaller)
        run: |
          rm -f "CNKICitationTool.spec"
          python -m PyInstaller --name "CNKICitationTool" --onefile --windowed --icon assets/app.ico \
            --hidden-import customtkinter --hidden-import playwright_stealth \
            --hidden-import openpyxl --hidden-import pystray \
            --collect-all playwright --collect-all playwright_stealth --collect-all pystray \
            --hidden-import certifi \
            --add-data "assets/批量引文模板.xlsx;assets" \
            --add-data "assets/cnki_icon.png;assets" \
            --add-data "assets/cnki_icon_dark.png;assets" \
            --add-data "assets/cnki_icon.ico;assets" \
            --add-data "assets/cnki_icon_dark.ico;assets" \
            cnki_gui.py

      # ═════════════════════════════════════════════════════
      # ② Rust / Tauri 构建（两个 NSIS 安装包：内置版 + 联网引导版）
      # ═════════════════════════════════════════════════════
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry, index & binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            cnki_rust/target
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('cnki_rust/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bin-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0"

      - name: Bump version in Rust source
        working-directory: cnki_rust/src-tauri
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 更新 tauri.conf.json version
          python -c "import json; p='tauri.conf.json'; c=json.load(open(p,encoding='utf-8')); c['version']='${VER}'; json.dump(c,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False); print('tauri.conf.json version -> ${VER}')"
          # 更新 Cargo.toml version（两处：src-tauri 应用 + 根库）
          sed -i "s/^version = .*/version = \"${VER}\"/" Cargo.toml
          sed -i "s/^version = .*/version = \"${VER}\"/" ../Cargo.toml
          echo "Rust version -> $VER"

      # —— 第一次构建：内置 WebView2 的离线安装包（~150MB，国内用户离线可装）——
      - name: Build Tauri offline installer
        working-directory: cnki_rust/src-tauri
        run: |
          node -e "const fs=require('fs');const p='tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.bundle.windows.webviewInstallMode.type='offlineInstaller';fs.writeFileSync(p,JSON.stringify(d,null,2));"
          cargo tauri build
          mkdir -p ../../dist
          cp target/release/bundle/nsis/*.exe ../../dist/CNKICitationTool-rs-offline-installer.exe
          echo "offline installer -> $(du -h ../../dist/CNKICitationTool-rs-offline-installer.exe | cut -f1)"

      # —— 第二次构建：安装时联网下载 WebView2 的轻量安装包（用户机器拉取）——
      - name: Build Tauri lite installer
        working-directory: cnki_rust/src-tauri
        run: |
          node -e "const fs=require('fs');const p='tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.bundle.windows.webviewInstallMode.type='embedBootstrapper';fs.writeFileSync(p,JSON.stringify(d,null,2));"
          cargo tauri build
          cp target/release/bundle/nsis/*.exe ../../dist/CNKICitationTool-rs-lite-installer.exe
          echo "lite installer -> $(du -h ../../dist/CNKICitationTool-rs-lite-installer.exe | cut -f1)"

      - name: Restore tauri.conf.json webviewInstallMode
        run: |
          node -e "const fs=require('fs');const p='cnki_rust/src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.bundle.windows.webviewInstallMode.type='offlineInstaller';fs.writeFileSync(p,JSON.stringify(d,null,2));"

      # —— 编译 Gitee 离线包用的自合并引导器（offline_join.rs，~270KB）——
      - name: Build offline join launcher (Rust)
        run: |
          rustc --edition 2021 -O -C strip=symbols cnki_rust/offline_join.rs -o dist/CNKICitationTool-rs-offline.exe
          echo "launcher -> dist/CNKICitationTool-rs-offline.exe ($(du -h dist/CNKICitationTool-rs-offline.exe | cut -f1))"

      # ═════════════════════════════════════════════════════
      # ③ 发布
      # ═════════════════════════════════════════════════════
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/CNKICitationTool.exe
            dist/CNKICitationTool-rs-offline-installer.exe
            dist/CNKICitationTool-rs-lite-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Gitee Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          EXE_PATH_PYTHON: dist/CNKICitationTool.exe
          EXE_PATH_RS_LITE: dist/CNKICitationTool-rs-lite-installer.exe
          EXE_PATH_RS_OFFLINE: dist/CNKICitationTool-rs-offline-installer.exe
          NOTES: ${{ github.event.head_commit.message }}
          BRANCH: main
        run: python .github/workflows/sync_gitee.py
